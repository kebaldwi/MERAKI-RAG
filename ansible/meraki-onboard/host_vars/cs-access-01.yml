---
# host_vars/cs-access-01.yml
# Example: Cloud Configuration mode — C9300-48P running 17.18.3
switch:
  name: "cs-access-01"
  serial: "Q2AB-XXXX-XXXX"          # Meraki Cloud ID (label on device) [S3]
  model: "C9300-48P"
  ios_xe_version: "17.18.3"
  onboarding_mode: "cloud"           # cloud | device
  target_ios_xe_version: "17.18.3"   # firmware upgrade target [S7]
  upgrade_image: "cat9k_iosxe.17.18.03.SPA.bin"
  upgrade_image_url: ""              # optional HTTP/TFTP URL for image copy

  meraki:
    org_id: "{{ meraki_org_id }}"
    network_id: "{{ meraki_network_id }}"
    claim_method: "serial"            # cloud_id | order | serial

  features:
    vlans:
      - { id: 10, name: "DATA" }
      - { id: 20, name: "VOICE" }
      - { id: 99, name: "MGMT" }

    access_ports:
      - interface: "GigabitEthernet1/0/1"
        vlan: 10
        voice_vlan: 20
        stp_portfast: true
        description: "Workstation-01"
      - interface: "GigabitEthernet1/0/2"
        vlan: 10
        voice_vlan: 20
        stp_portfast: true
        description: "Workstation-02"

    trunk_ports:
      - interface: "TenGigabitEthernet1/1/1"
        allowed_vlans: "10,20,99"
        native_vlan: 1
        description: "Uplink-to-Core"

    etherchannel:
      - id: 1
        mode: "active"
        members:
          - "GigabitEthernet1/0/47"
          - "GigabitEthernet1/0/48"
        description: "LAG-to-Server"

    svis:
      - vlan: 10
        ip: "10.10.10.1"
        mask: "255.255.255.0"
        description: "DATA-SVI"
      - vlan: 99
        ip: "10.99.99.1"
        mask: "255.255.255.0"
        description: "MGMT-SVI"

    routing:
      ospf:
        process: 1
        networks:
          - { net: "10.10.10.0", wc: "0.0.0.255", area: 0 }
          - { net: "10.99.99.0", wc: "0.0.0.255", area: 0 }
      bgp:                               # requires 17.18.1+ [S5]
        asn: 65001
        neighbors:
          - { ip: "10.0.0.2", remote_as: 65002, description: "WAN-Peer" }

    security:
      dhcp_snooping:
        enabled: true
        vlans: "10,20"
      acls:
        - name: "MGMT-IN"
          rules:
            - "permit ip 10.0.0.0 0.0.0.255 any"
            - "deny   ip any any log"
      port_security:
        - interface: "GigabitEthernet1/0/1"
          max_mac: 2
          violation: "restrict"

    qos:
      - interface: "GigabitEthernet1/0/1"
        policy: "VOICE-PRIORITY"

    stp:
      mode: "rapid-pvst"
      root_primary_vlans: [10, 20]
      root_secondary_vlans: [99]

    # gap features — CLI-only; Device Config mode required [S3]
    cli_only: []
